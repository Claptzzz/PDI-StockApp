# docker-compose para levantar Postgres + backend en local con imágenes de producción.
# NO reemplaza el flujo de desarrollo (npm run start:dev); sirve para probar la imagen
# del backend y las migraciones de forma integrada.
#
# Uso:
#   1. cp .env.example .env   (y completa los valores)
#   2. docker compose up --build
#
# Las variables se leen del archivo .env de esta misma carpeta (raíz del repo).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdi}
      POSTGRES_DB: ${POSTGRES_DB:-pdi}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pdi} -d ${POSTGRES_DB:-pdi}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Dentro de la red de compose, el host de la DB es el nombre del servicio: db
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      PROFESSOR_EMAILS: ${PROFESSOR_EMAILS:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET}
    ports:
      - '3000:3000'

volumes:
  pgdata:
