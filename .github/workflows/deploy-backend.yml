# CD del backend — construye la imagen, la publica en GHCR y la despliega en Azure App Service.
# Se dispara al integrar a main (push) y manualmente (workflow_dispatch).
name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita despliegues solapados: si entra uno nuevo, espera a que termine el anterior.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Hostname público por defecto del App Service (nombre en minúsculas).
  HEALTH_URL: https://pdi-stock-d5adfudsg6e6bzdk.brazilsouth-01.azurewebsites.net/health

jobs:
  build-and-push:
    name: Build & push image (GHCR)
    runs-on: ubuntu-latest
    # Docker exige el nombre del repo en minúsculas, pero github.repository_owner puede
    # tener mayúsculas (p.ej. "Claptzzz"). Calculamos el nombre en minúsculas una sola vez
    # y lo exponemos como output para que el job de deploy (otro job) también lo use:
    # $GITHUB_ENV NO cruza entre jobs, pero los outputs sí.
    outputs:
      image: ${{ steps.img.outputs.image_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: img
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/pdi-stock-backend"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Cache de la propia infra de GitHub Actions para acelerar builds sucesivos.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy a Azure App Service
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # IMPORTANTE: la imagen debe ser accesible por App Service.
      # Por defecto los paquetes de GHCR son PRIVADOS. Opciones:
      #   a) Hacer el package "public" en GHCR (Package settings -> Change visibility), o
      #   b) Dejarlo privado y configurar en App Service las credenciales del registry
      #      (Deployment Center -> Container -> Private registry: server ghcr.io,
      #       usuario = tu usuario de GitHub, password = un PAT con scope read:packages),
      #      o ajustar DOCKER_REGISTRY_SERVER_URL/USERNAME/PASSWORD en App settings.
      - name: Deploy imagen a Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: PDI-Stock
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # Viene del output del job de build (ya en minúsculas).
          images: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}

      # Smoke test: si el contenedor no levanta o /health no responde OK, el job falla.
      - name: Smoke test /health
        run: |
          echo "Esperando a que el contenedor arranque..."
          sleep 30
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 15 "$HEALTH_URL") || body=""
            echo "Intento $attempt -> '$body'"
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "✅ Health OK"
              exit 0
            fi
            echo "Aún no responde OK; reintentando en 15s..."
            sleep 15
          done
          echo "❌ Smoke test falló: /health no devolvió {\"status\":\"ok\"}"
          exit 1
