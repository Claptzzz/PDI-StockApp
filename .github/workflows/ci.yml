# CI — Quality gate de Trunk Based Development.
# Corre en cada PR hacia main y en cada push a main. Si falla, no se mergea.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela runs viejos de la misma rama/PR si llega un push nuevo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      # nest build compila tipos que dependen de @prisma/client: hay que generarlo antes.
      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  backend-e2e:
    name: Backend (tests e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # Base de datos REAL para la suite: los tests no usan mocks de Prisma.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pdi
          POSTGRES_PASSWORD: pdi
          POSTGRES_DB: pdi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdi -d pdi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Única variable que la suite necesita de fuera: dónde está la base de test.
      TEST_DATABASE_URL: postgresql://pdi:pdi@localhost:5432/pdi_test?schema=public
      # Secretos de mentira: Google y Supabase están mockeados en los tests, y el
      # JWT lo firma la propia suite con este mismo secreto.
      JWT_SECRET: ci-jwt-secret-de-pruebas-1234
      GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-client-secret
      SUPABASE_URL: http://supabase.invalid
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      SUPABASE_BUCKET: ci-bucket
      # ADMIN_EMAILS / PROFESSOR_EMAILS NO se definen aquí a propósito: los tests
      # afirman sobre correos concretos, así que las listas viven fijas en
      # backend/test/support/env.ts y no deben poder cambiarse desde CI.

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # `test:e2e` aplica las migraciones con `prisma migrate deploy` en su globalSetup.
      - name: Tests e2e
        run: npm run test:e2e

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      # Las VITE_* se hornean en tiempo de build. Se toman de secrets; si no existen,
      # se usan valores dummy para que el build de CI no falle (esto NO despliega nada).
      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || 'dummy-client-id.apps.googleusercontent.com' }}
        run: npm run build
